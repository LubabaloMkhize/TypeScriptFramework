name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # -----------------------------
    # Checkout code
    # -----------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------
    # Setup Node.js
    # -----------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # -----------------------------
    # Install dependencies
    # -----------------------------
    - name: Install dependencies
      run: npm ci

    # -----------------------------
    # Install Playwright Browsers
    # -----------------------------
    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    # -----------------------------
    # Run Playwright tests
    # -----------------------------
    - name: Run Playwright tests
      run: npx playwright test

    # -----------------------------
    # Generate Allure report
    # -----------------------------
    - name: Generate Allure report
      if: always()
      run: |
        npx allure-commandline generate allure-results --clean -o allure-report

    # -----------------------------
    # Upload Playwright report
    # -----------------------------
    - name: Upload Playwright report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # -----------------------------
    # Upload Allure report
    # -----------------------------
    - name: Upload Allure report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # -----------------------------
    # Send email notification (NO attachments)
    # -----------------------------
    - name: Send test report email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright Test Execution Results – GitHub Actions"
        body: |
          Good day,

          The Playwright test execution has completed.

          Repository: ${{ github.repository }}
          Branch:     ${{ github.ref_name }}
          Status:     ${{ job.status }}

          Reports can be downloaded from the GitHub Actions run:
          👉 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Available artifacts:
          • Playwright HTML Report
          • Allure Report

          Regards,
          CI Automation Pipeline
        to: lubabalo.mkhize@prasa.com
        from: Lubabalo.Mkhize@gmail.com